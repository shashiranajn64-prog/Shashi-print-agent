name: Build Shashi APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Make APK
        run: |
          echo "Building..."
      - uses: softprops/action-gh-release@v1
        with:
          files: app-debug.apk
